[project]
name = "hubahu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "core",
    "api",
    "worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core/src", "api/src", "worker/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff==0.16.10",
]
